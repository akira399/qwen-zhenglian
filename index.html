<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>千问证链 · 答辩证据核对</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="eyebrow">效率进化 · 阿里云 Qwen 科研提效 · 个人初赛</p>
      <h1>千问证链</h1>
      <p class="slogan">没有出处的结论，不能进答辩稿。</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <section class="notice" id="notice"></section>

  <main class="layout">
    <section class="col paper">
      <div class="col-head">
        <h2>材料</h2>
        <div class="tabs" id="tabs"></div>
      </div>
      <article id="doc" class="doc"></article>
    </section>

    <section class="col">
      <div class="col-head">
        <h2>主张</h2>
        <p class="hint">点一条，左边跳到原文。</p>
      </div>
      <div id="claims"></div>
    </section>

    <section class="col">
      <div class="col-head">
        <h2>能讲与不能讲</h2>
      </div>
      <h3>导师对账</h3>
      <div id="mentor"></div>
      <h3>答辩提纲</h3>
      <ol id="outline"></ol>
    </section>
  </main>

  <footer>
    <p>样例课题为原创虚构。林夏不是参赛者。引用必须在原文中定位，定位失败不会显示为已证实。</p>
    <p><a href="poster.html">投稿封面</a></p>

  <script src="app.js"></script>
